<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小护康养 mini · 开源项目</title>

  <!-- Element Plus 样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.10.1/dist/index.css" />
  <!-- Vue 3（含运行时编译器，可在浏览器直接编译模板） -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <!-- Element Plus 全量包 -->
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.10.1/dist/index.full.min.js"></script>
  <!-- Element Plus 图标 -->
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif; background: #f5f7fa; }

    .app-container { padding: 20px; }
    .about-page { min-height: 100vh; background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%); padding-bottom: 40px; }

    /* 顶部导航 */
    .about-page .site-nav { position: sticky; top: -20px; z-index: 100; margin: -20px -20px 0; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(10px); box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15); }
    .about-page .site-nav .site-nav-inner { max-width: 1400px; margin: 0 auto; padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .about-page .site-nav .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .about-page .site-nav .nav-brand .nav-logo { width: 30px; height: 30px; display: block; }
    .about-page .site-nav .nav-brand .nav-title { font-size: 1.15rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .about-page .site-nav .nav-links { display: flex; align-items: center; gap: 24px; }
    .about-page .site-nav .nav-links .nav-link { color: rgba(255, 255, 255, 0.85); font-size: 0.95rem; cursor: pointer; transition: color 0.2s ease; }
    .about-page .site-nav .nav-links .nav-link:hover { color: #41b883; }

    /* 欢迎区域 */
    .about-page .welcome-section { background: linear-gradient(135deg, #1b2a4a 0%, #2f6b4f 100%); color: #fff; padding: 50px 0; text-align: center; margin: 0 -20px 30px; position: relative; overflow: hidden; }
    .about-page .welcome-section::before { content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%); transform: rotate(30deg); }
    .about-page .welcome-section .logo-container { margin-bottom: 15px; display: flex; justify-content: center; }
    .about-page .welcome-section .logo-container .logo-icon { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.15); border-radius: 50%; font-size: 40px; backdrop-filter: blur(10px); animation: float 3s ease-in-out infinite; }
    .about-page .welcome-section .welcome-content { max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }
    .about-page .welcome-section .welcome-content .welcome-title { font-size: 2.8rem; font-weight: 700; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2); }
    .about-page .welcome-section .welcome-content .welcome-title .logo-text { color: #ffd700; }
    .about-page .welcome-section .welcome-content .welcome-subtitle { font-size: 1.2rem; margin-bottom: 25px; opacity: 0.9; font-weight: 300; max-width: 800px; margin-left: auto; margin-right: auto; }
    .about-page .welcome-section .welcome-content .version-badge { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .about-page .welcome-section .welcome-content .version-badge .el-tag { border: none; }
    .about-page .welcome-section .welcome-content .version-badge .badge-license { background: #f0a020; color: #fff; }
    .about-page .welcome-section .welcome-content .version-badge .badge-checkin { background: #2f8bfd; color: #fff; }
    .about-page .welcome-section .welcome-content .version-badge .badge-care { background: #7C3AED; color: #fff; }
    .about-page .welcome-section .welcome-content .version-badge .badge-monitor { background: #0ea5e9; color: #fff; }
    .about-page .welcome-section .welcome-content .version-badge .badge-meals { background: #41b883; color: #fff; }

    /* 区块通用 */
    .about-page .section-block { max-width: 1200px; margin: 0 auto 40px; }
    .about-page .section-main-title { text-align: center; font-size: 1.8rem; font-weight: 700; color: #333; margin-bottom: 8px; }
    .about-page .section-main-desc { text-align: center; color: #888; font-size: 0.95rem; margin: 0 auto 24px; }
    .about-page .main-content { margin: 0 auto; padding: 0 4px; row-gap: 20px; }

    /* 卡片通用 */
    .about-page .module-card { position: relative; background: #fff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); overflow: hidden; transition: all 0.3s ease; height: 100%; margin-bottom: 20px; }
    .about-page .module-card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12); }
    .about-page .module-card .card-header { padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
    .about-page .module-card .card-header .header-icon { font-size: 32px; }
    .about-page .module-card .card-header .header-text { display: flex; flex-direction: column; }
    .about-page .module-card .card-header .section-title { font-size: 1.35rem; font-weight: 600; margin: 0; color: #fff; }
    .about-page .module-card .card-header .section-tag { font-size: 0.78rem; color: rgba(255, 255, 255, 0.85); margin-top: 2px; }
    .about-page .module-card .card-body { padding: 24px; }
    .about-page .module-card .card-body .module-desc { color: #666; font-size: 0.95rem; margin-bottom: 20px; line-height: 1.6; }

    /* 模块配色 */
    .about-page .checkin-card .card-header { background: linear-gradient(135deg, #2f8bfd 0%, #53a8ff 100%); }
    .about-page .care-card .card-header { background: linear-gradient(135deg, #7C3AED 0%, #a855f7 100%); }
    .about-page .monitor-card .card-header { background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 100%); }
    .about-page .meals-card .card-header { background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%); }
    .about-page .wms-card .card-header { background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%); }
    .about-page .patrol-card .card-header { background: linear-gradient(135deg, #db2777 0%, #f472b6 100%); }
    .about-page .mobile-card .card-header { background: linear-gradient(135deg, #475569 0%, #64748b 100%); }
    .about-page .miniprogram-card .card-header { background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%); }

    /* Pro 标识 */
    .about-page .module-card.is-pro { border: 1px solid #f0a020; box-shadow: 0 8px 24px rgba(240, 160, 32, 0.18); }
    .about-page .module-card.is-pro .pro-badge { position: absolute; top: 12px; right: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: linear-gradient(135deg, #f0a020 0%, #f7c948 100%); color: #fff; font-size: 0.75rem; font-weight: 700; box-shadow: 0 2px 8px rgba(240, 160, 32, 0.4); }
    .about-page .module-card.is-pro .pro-badge .el-icon { font-size: 0.85em; }

    /* 技术栈卡片 */
    .about-page .ability-card .card-header { background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%); }
    .about-page .ability-card .ability-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .about-page .ability-card .ability-grid .ability-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: #f8fafc; border-radius: 10px; transition: all 0.2s ease; }
    .about-page .ability-card .ability-grid .ability-item:hover { background: #eef2f7; transform: translateX(3px); }
    .about-page .ability-card .ability-grid .ability-item .ability-icon { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 8px; color: #4b6cb7; font-size: 1.2rem; flex-shrink: 0; }
    .about-page .ability-card .ability-grid .ability-item .ability-info { flex: 1; }
    .about-page .ability-card .ability-grid .ability-item .ability-info h4 { font-size: 0.95rem; font-weight: 600; color: #333; margin: 0 0 4px 0; }
    .about-page .ability-card .ability-grid .ability-item .ability-info p { font-size: 0.82rem; color: #666; margin: 0; line-height: 1.4; }

    /* 快速开始卡片 */
    .about-page .quick-card .card-header { background: linear-gradient(135deg, #10b981 0%, #34d399 100%); }
    .about-page .quick-card .cmd-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .about-page .quick-card .cmd-list .cmd-item { display: flex; align-items: center; gap: 10px; background: #0f172a; border-radius: 10px; padding: 8px 12px; }
    .about-page .quick-card .cmd-list .cmd-item .cmd-step { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: #10b981; color: #fff; border-radius: 50%; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; }
    .about-page .quick-card .cmd-list .cmd-item .cmd-code { flex: 1; color: #a5f3fc; font-family: Menlo, Consolas, monospace; font-size: 0.82rem; white-space: nowrap; overflow-x: auto; }
    .about-page .quick-card .cmd-list .cmd-item .cmd-copy { color: #94a3b8; flex-shrink: 0; }
    .about-page .quick-card .cmd-list .cmd-item .cmd-copy:hover { color: #10b981; }
    .about-page .quick-card .quick-actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .about-page .quick-card .quick-actions .el-button { justify-content: center; width: 100%; margin-left: 0; }
    .about-page .quick-card .contact-info { padding-top: 20px; border-top: 1px solid #e5e7eb; }
    .about-page .quick-card .contact-info h4 { font-size: 1rem; color: #333; margin-bottom: 12px; }
    .about-page .quick-card .contact-info p { display: flex; align-items: center; gap: 8px; color: #666; font-size: 0.9rem; margin: 8px 0; }
    .about-page .quick-card .contact-info p .el-icon { color: #409EFF; }

    /* 功能列表 */
    .about-page .feature-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .about-page .feature-list .feature-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; background: #f8fafc; border-radius: 10px; transition: all 0.2s ease; }
    .about-page .feature-list .feature-item:hover { background: #f1f5f9; transform: translateX(3px); }
    .about-page .feature-list .feature-item .feature-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 8px; color: #409EFF; font-size: 1.1rem; flex-shrink: 0; }
    .about-page .feature-list .feature-item .feature-info { flex: 1; }
    .about-page .feature-list .feature-item .feature-info h4 { font-size: 0.95rem; font-weight: 600; color: #333; margin: 0 0 4px 0; }
    .about-page .feature-list .feature-item .feature-info p { font-size: 0.85rem; color: #666; margin: 0; line-height: 1.4; }

    /* 模块统计 */
    .about-page .module-stats { display: flex; justify-content: space-around; background: #f8fafc; border-radius: 12px; padding: 16px; }
    .about-page .module-stats .stat-box { display: flex; flex-direction: column; align-items: center; }
    .about-page .module-stats .stat-box .stat-num { font-size: 1.15rem; font-weight: 700; color: #333; margin-bottom: 4px; }
    .about-page .module-stats .stat-box .stat-label { font-size: 0.78rem; color: #888; text-align: center; }

    /* 参与共建 */
    .about-page .contribute-section .contribute-card { text-align: center; }
    .about-page .contribute-section .contribute-card .card-body { padding: 30px 20px; }
    .about-page .contribute-section .contribute-card .contribute-icon { font-size: 40px; margin-bottom: 12px; }
    .about-page .contribute-section .contribute-card h4 { font-size: 1.1rem; font-weight: 600; color: #333; margin-bottom: 8px; }
    .about-page .contribute-section .contribute-card p { font-size: 0.85rem; color: #666; margin: 0; line-height: 1.6; }

    /* 开源优势 */
    .about-page .advantage-item { background: #fff; border-radius: 16px; padding: 30px 20px; text-align: center; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06); transition: all 0.3s ease; margin-bottom: 20px; }
    .about-page .advantage-item:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); }
    .about-page .advantage-item .adv-icon { font-size: 40px; margin-bottom: 12px; }
    .about-page .advantage-item h4 { font-size: 1.1rem; font-weight: 600; color: #333; margin-bottom: 8px; }
    .about-page .advantage-item p { font-size: 0.85rem; color: #666; margin: 0; }

    /* 动画 */
    .about-page .card-animate { animation: slideUp 0.6s ease-out forwards; opacity: 0; transform: translateY(30px); }
    .about-page .card-animate:nth-child(1) { animation-delay: 0.1s; }
    .about-page .card-animate:nth-child(2) { animation-delay: 0.2s; }
    .about-page .card-animate:nth-child(3) { animation-delay: 0.3s; }
    .about-page .card-animate:nth-child(4) { animation-delay: 0.4s; }
    .about-page .card-animate:nth-child(5) { animation-delay: 0.5s; }
    .about-page .card-animate:nth-child(6) { animation-delay: 0.6s; }
    .about-page .card-animate:nth-child(7) { animation-delay: 0.7s; }
    .about-page .card-animate:nth-child(8) { animation-delay: 0.8s; }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

    /* 响应式 */
    @media (max-width: 768px) {
      .about-page .welcome-section { padding: 40px 0; }
      .about-page .welcome-section .welcome-content .welcome-title { font-size: 2rem; }
      .about-page .welcome-section .welcome-content .welcome-subtitle { font-size: 1rem; }
      .about-page .ability-card .ability-grid { grid-template-columns: 1fr; }
      .about-page .advantage-item { margin-bottom: 16px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- 页面模板（字符串模板，Vue 运行时编译器解析，支持自定义组件自闭合） -->
  <script type="text/x-template" id="tmpl">
    <div class="app-container about-page">
      <!-- 顶部导航 -->
      <div class="site-nav">
        <div class="site-nav-inner">
          <div class="nav-brand" @click="goTarget('/index')">
            <img src="logo.svg" alt="小护康养 logo" class="nav-logo" />
            <span class="nav-title">小护康养 mini</span>
          </div>
          <div class="nav-links">
            <a class="nav-link" @click="goTarget('/index')">首页</a>
            <el-button type="primary" round @click="goTarget('/login')">
              <el-icon><UserFilled /></el-icon>
              登录入口
            </el-button>
          </div>
        </div>
      </div>

      <!-- 头部欢迎区域 -->
      <div class="welcome-section">
        <div class="welcome-content">
          <div class="logo-container">
            <div class="logo-icon">
              <img src="logo.svg" alt="小护康养 logo" class="leaf-icon" style="width: 48px; height: 48px" />
            </div>
          </div>
          <h1 class="welcome-title">
            <span class="logo-text">小护康养</span>mini · 开源项目
          </h1>
          <p class="welcome-subtitle">基于 Vue 3 + Element Plus + Vite 的养老机构数字化运营管理系统，MIT 协议开源，代码公开、自由使用、欢迎社区共建</p>
          <div class="version-badge">
            <el-tag type="success" size="large" round>v{{ version }}</el-tag>
            <el-tag size="large" round class="badge-license">MIT License</el-tag>
            <el-tag size="large" round class="badge-checkin">Vue 3</el-tag>
            <el-tag size="large" round class="badge-care">Element Plus</el-tag>
            <el-tag size="large" round class="badge-monitor">Vite</el-tag>
            <el-tag size="large" round class="badge-meals">Pinia</el-tag>
          </div>
        </div>
      </div>

      <!-- 项目定位 -->
      <div class="section-block">
        <h2 class="section-main-title">一个开源的康养管理系统</h2>
        <p class="section-main-desc">以 RuoYi-Vue3 骨架为底座二次开发，入住、照护、膳食等核心场景开源可用，智能监护为 Pro 版能力</p>
        <el-row :gutter="20" justify="center" class="main-content">
          <el-col :xs="24" :sm="12" :md="8" :lg="6" v-for="module in modules" :key="module.key">
            <div class="module-card card-animate" :class="[module.key + '-card', { 'is-pro': module.pro }]">
              <div v-if="module.pro" class="pro-badge">
                <el-icon><Lock /></el-icon> Pro
              </div>
              <div class="card-header">
                <div class="header-icon">{{ module.icon }}</div>
                <div class="header-text">
                  <h2 class="section-title">{{ module.name }}</h2>
                  <span class="section-tag">{{ module.tag }}</span>
                </div>
              </div>
              <div class="card-body">
                <p class="module-desc">{{ module.desc }}</p>

                <div class="feature-list">
                  <div class="feature-item" v-for="(item, index) in module.features" :key="index">
                    <el-icon class="feature-icon"><component :is="item.icon" /></el-icon>
                    <div class="feature-info">
                      <h4>{{ item.title }}</h4>
                      <p>{{ item.desc }}</p>
                    </div>
                  </div>
                </div>

                <div class="module-stats">
                  <div class="stat-box" v-for="(stat, index) in module.stats" :key="index">
                    <span class="stat-num">{{ stat.num }}</span>
                    <span class="stat-label">{{ stat.label }}</span>
                  </div>
                </div>
              </div>
            </div>
          </el-col>
        </el-row>
      </div>

      <!-- 技术栈 + 快速开始 -->
      <div class="section-block">
        <h2 class="section-main-title">开箱即用的技术底座</h2>
        <p class="section-main-desc">主流前端技术栈组合，工程规范与文档齐备，三步即可跑起属于你的实例</p>
        <el-row :gutter="20" class="main-content">
          <el-col :xs="24" :lg="16">
            <div class="module-card ability-card card-animate">
              <div class="card-header">
                <div class="header-icon">🧰</div>
                <h2 class="section-title">技术栈与工程能力</h2>
              </div>
              <div class="card-body">
                <p class="module-desc">主流前端技术组合，模块划分清晰，注释与 README 齐备，方便二次开发与定制扩展</p>
                <div class="ability-grid">
                  <div class="ability-item" v-for="(item, index) in abilities" :key="index">
                    <el-icon class="ability-icon"><component :is="item.icon" /></el-icon>
                    <div class="ability-info">
                      <h4>{{ item.title }}</h4>
                      <p>{{ item.desc }}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </el-col>

          <el-col :xs="24" :lg="8">
            <div class="module-card quick-card card-animate">
              <div class="card-header">
                <div class="header-icon">🚀</div>
                <h2 class="section-title">快速开始</h2>
              </div>
              <div class="card-body">
                <p class="module-desc">三步跑起属于你的实例，也欢迎提 Issue 与 PR 参与共建</p>

                <div class="cmd-list">
                  <div class="cmd-item" v-for="(cmd, index) in quickStart" :key="index">
                    <div class="cmd-step">{{ index + 1 }}</div>
                    <code class="cmd-code">{{ cmd }}</code>
                    <el-button class="cmd-copy" link type="primary" @click="copyCmd(cmd)">
                      <el-icon><CopyDocument /></el-icon>
                    </el-button>
                  </div>
                </div>

                <div class="quick-actions">
                  <el-button type="primary" size="large" @click="goTarget('/login')" round>
                    <el-icon><UserFilled /></el-icon>
                    在线体验
                  </el-button>
                  <el-button type="success" size="large" @click="goTarget('/register')" round>
                    <el-icon><EditPen /></el-icon>
                    注册账号
                  </el-button>
                </div>

                <div class="contact-info">
                  <h4>开源信息</h4>
                  <p><el-icon><Document /></el-icon> 许可证：MIT · 可免费商用</p>
                  <p><el-icon><Share /></el-icon> 仓库：gitee.com/chongkelai/xiaohucare-mini-vue.git（骨架同源）</p>
                  <p><el-icon><Operation /></el-icon> 分支：主分支保持稳定，特性走独立分支</p>
                </div>
              </div>
            </div>
          </el-col>
        </el-row>
      </div>

      <!-- 开源优势 -->
      <div class="section-block">
        <h2 class="section-main-title">为什么值得使用与参与</h2>
        <el-row :gutter="20">
          <el-col :xs="12" :sm="6" v-for="(adv, index) in advantages" :key="index">
            <div class="advantage-item">
              <div class="adv-icon">{{ adv.icon }}</div>
              <h4>{{ adv.title }}</h4>
              <p>{{ adv.desc }}</p>
            </div>
          </el-col>
        </el-row>
      </div>

      <!-- 参与共建 -->
      <div class="section-block contribute-section">
        <h2 class="section-main-title">参与共建</h2>
        <p class="section-main-desc">代码之外同样欢迎反馈：文档勘误、体验问题、功能建议都是对开源社区的贡献</p>
        <el-row :gutter="20" class="main-content">
